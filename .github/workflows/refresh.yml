# Rebuilds the most-starred chronicles weekly (the top CHRONICLE_REFRESH_TOP of index.json, default
# 12), so the islands people visit most keep up with their repos. A repo that fails to build keeps
# its last chronicle.
name: Refresh chronicles

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC, off the hour when scheduled jobs pile up
  workflow_dispatch:

permissions: {}

concurrency:
  group: chronicle-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile

      - name: Rebuild the top chronicles
        env:
          TOP: ${{ vars.CHRONICLE_REFRESH_TOP }}
        run: |
          mkdir -p "$RUNNER_TEMP/out/chronicles" "$RUNNER_TEMP/out/og"
          built=0
          for repo in $(bun scripts/refresh.ts "$TOP"); do
            slug=$(echo "$repo" | tr '[:upper:]' '[:lower:]' | sed 's|/|__|')
            if bun builder/chronicle.js deep "$repo" --out "$RUNNER_TEMP/out/chronicles/$slug.json.gz" &&
               bun scripts/og.ts "$RUNNER_TEMP/out/chronicles/$slug.json.gz" "$RUNNER_TEMP/out/og/$slug.png"; then
              built=$((built + 1))
            else
              echo "::warning::$repo didn't rebuild; its last chronicle stays"
              rm -f "$RUNNER_TEMP/out/chronicles/$slug.json.gz" "$RUNNER_TEMP/out/og/$slug.png"
            fi
          done
          echo "BUILT=$built" >> "$GITHUB_ENV"

      - name: Publish them
        if: env.BUILT != '0'
        run: >-
          scripts/publish.sh "$RUNNER_TEMP/out" "chronicle: refresh $BUILT"

      - name: Refresh the CDN
        if: env.BUILT != '0'
        run: |
          for file in "$RUNNER_TEMP"/out/chronicles/*.json.gz "$RUNNER_TEMP"/out/og/*.png; do
            path="${file#"$RUNNER_TEMP/out/"}"
            curl -fsS --max-time 20 "https://purge.jsdelivr.net/gh/$GITHUB_REPOSITORY@main/$path" > /dev/null || true
          done
          curl -fsS --max-time 20 "https://purge.jsdelivr.net/gh/$GITHUB_REPOSITORY@main/index.json" > /dev/null || true
