# Deploys site/ (the per-repo preview pages, scripts/site.ts) plus og/ (their cards) to GitHub Pages.
# Off until Pages is enabled with "GitHub Actions" as its source and the repo variable PAGES_ENABLED
# is "true". It follows the build and refresh workflows: their pushes use the job token, and GitHub
# starts no workflow from those, but it does start workflow_run ones.
name: Deploy preview pages

on:
  workflow_run:
    workflows: ["Build a chronicle", "Refresh chronicles"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      vars.PAGES_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
      - run: cp -R og site/og
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
